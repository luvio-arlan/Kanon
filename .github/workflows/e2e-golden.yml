name: Golden E2E (Playwright · Forced RLS)

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e-golden.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/e2e-golden.yml"
  workflow_dispatch:

jobs:
  e2e-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @kanon/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-golden-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
